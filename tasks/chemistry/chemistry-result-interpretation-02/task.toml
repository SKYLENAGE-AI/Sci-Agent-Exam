artifacts = ["/home/agent/results"]

[metadata]
task_id = "SCI03-RI-2026-002"
domain = "SCI-03"
domain_name = "Chemistry"
tags = [
  "COG-01",
  "COG-04",
  "COG-06",
  "COG-07",
  "TOOL-02",
  "TOOL-06",
  "DATA-03",
  "DATA-05",
  "INT-05",
  "TSK-01",
