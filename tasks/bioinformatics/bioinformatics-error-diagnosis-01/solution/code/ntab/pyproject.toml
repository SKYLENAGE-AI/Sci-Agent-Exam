[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ntab-offline-replay"
version = "0.1.0"
description = "Offline replay for an assay-retention audit"
requires-python = ">=3.11"
dependencies = [
  "numpy==1.26.*",
  "pandas==2.2.*",
  "rdkit==2025.3.6",
  "scipy==1.13.*",
  "tqdm==4.66.*",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ntab_preprocess", "src/ntab_evaluate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
