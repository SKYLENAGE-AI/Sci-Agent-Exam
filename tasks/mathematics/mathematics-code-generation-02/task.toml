artifacts = ["/home/agent/results"]

[metadata]
task_id = "SCI11-CODE-2026-218"
domain = "SCI-11"
domain_name = "Mathematics"
tags = [
  "COG-01",
  "COG-02",
  "COG-06",
  "TOOL-02",
  "DATA-03",
  "DATA-05",
  "INT-02",
  "TSK-01",
